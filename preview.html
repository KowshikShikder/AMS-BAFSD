<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAF Shaheen College Dhaka | AMS Preview</title>
<style>
:root{--bg:#f5f3ec;--surface:#fff;--ink:#16233f;--soft:#52607a;--faint:#8791a3;--accent:#a9791f;--accent-ink:#6b4d12;--rule:#ddd6c4;--rule2:#c7bfa8;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Georgia,"Noto Serif Bengali",serif;margin:0;letter-spacing:-.01em}
a{color:inherit}
.hdr{background:var(--surface);border-bottom:1px solid var(--rule)}
.hdr-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.crest{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:13px;color:var(--accent-ink);flex-shrink:0}
.bn{font-family:Georgia,serif;font-size:16px;font-weight:600;line-height:1.2}
.bs{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.nav{display:flex;gap:16px;font-size:13.5px;flex-wrap:wrap;align-items:center}
.nav a{color:var(--soft);text-decoration:none;padding-bottom:3px;border-bottom:2px solid transparent;cursor:pointer}
.nav a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.narrow{max-width:640px}
.eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);display:block;margin-bottom:6px}
.title{font-size:26px;margin-bottom:4px}
.sub{color:var(--soft);margin:0 0 20px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 1px 2px rgba(22,35,63,.06),0 8px 24px -12px rgba(22,35,63,.18)}
.pad{padding:18px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}.hdr-in{flex-direction:row;justify-content:space-between;align-items:center}}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--rule2);border-radius:4px;background:#fffdf9;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--rule2);background:var(--surface);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--soft)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:4px;border:1px solid transparent;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5}
.bp{background:var(--ink);color:#fff}.ba{background:var(--accent);color:#fff}
.bg{background:transparent;border-color:var(--rule2);color:var(--ink)}
.sm{padding:6px 11px;font-size:12.5px}
.seal{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1.4px solid;white-space:nowrap}
.seal i{width:6px;height:6px;border-radius:50%;background:currentColor}
.alert{padding:10px 14px;border-radius:4px;font-size:13.5px;border:1px solid;margin-bottom:12px}
.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.muted{color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
@media(min-width:760px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.stat b{font-family:Georgia,serif;font-size:22px;display:block}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.tool{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
@media(min-width:760px){.tool{grid-template-columns:repeat(6,1fr)}}
.tool .full{grid-column:1/-1}
.tool select,.tool input{padding:8px 10px;font-size:13.5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 12px;border-bottom:1.5px solid var(--rule2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:#faf8f2}
tbody tr:hover{background:#f3efe2}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--soft)}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px;font-size:13px}
.bd{position:fixed;inset:0;background:rgba(22,35,63,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:640px){.bd{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;padding:20px;border-radius:14px 14px 0 0}
@media(min-width:640px){.modal{border-radius:var(--r)}}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13.5px;margin:14px 0}
.dg div{overflow-wrap:anywhere}
hr{border:none;border-top:1px solid var(--rule);margin:16px 0}
.tl{margin-left:6px;padding-left:22px;border-left:2px solid var(--rule2)}
.ti{position:relative;padding-bottom:16px}
.ti:before{content:"";position:absolute;left:-29px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.tm{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--faint);margin-top:2px}
.seat{border:1.5px solid var(--rule2);border-radius:var(--r);padding:12px 16px;margin:14px 0;background:#fbf9f3;text-align:center}
.seat .h{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.seat .row{display:flex;justify-content:center;gap:30px;flex-wrap:wrap}
.seat small{display:block;font-size:10px;text-transform:uppercase;color:var(--faint)}
.doc{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:4px;padding:8px 10px;margin-bottom:8px;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
.seatgrid input{width:58px;padding:5px 6px;font-size:13px}
.demo{background:#fff8e6;border-bottom:1px solid #ecd9a6;font-size:12px;text-align:center;padding:6px 10px;color:#6b4d12}
.stat.click{cursor:pointer;text-align:left;font:inherit;width:100%}
.stat.click:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.stat.click.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.stats.three{grid-template-columns:repeat(3,1fr)}
.vc{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em}
.vc.BV{background:#e0ecff;color:#1e40af}.vc.EV{background:#fdecc8;color:#92400e}
.seatgrid table{border-collapse:separate;border-spacing:0;min-width:760px}
.seatgrid th,.seatgrid td{text-align:center;white-space:nowrap}
.seatgrid .sc{position:sticky;left:0;z-index:2;background:#fff;box-shadow:2px 0 0 var(--rule2);min-width:52px;font-size:14px}
.seatgrid thead .sc{z-index:3}
.seatgrid input{text-align:center}
.pill{display:inline-block;min-width:44px;padding:3px 10px;border-radius:6px;border:1px solid rgba(0,0,0,.12);font-size:15px}
.rolebtn{display:block;width:100%;margin-bottom:8px;text-align:left}
</style>
</head>
<body>
<div class="demo">Preview only &mdash; sample data, nothing is saved. The real app runs on Next.js + MongoDB.</div>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ---------- constants ---------- */
var VERSIONS=["Bangla","English"],SHIFTS=["Morning","Day"],CLASSES=["KG","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"],CATS=["Civil","BAF","SD","SEMC","Navy","Army"],GROUPS=["Science","B. Studies","Humanities"],GROUP_CLASSES=["IX","X","XI","XII"];
var VAB={Bangla:"BV",English:"EV"},SAB={Morning:"Mor",Day:"Day"};
var TYPES={admission:"Admission",shift_change:"Shift Change",version_change:"Version Change",miscellaneous:"Miscellaneous"};
var SESSION="27";
var TFIELDS={
 admission:["version","shift","class","group","name","guardianName","category","remarks","reference"],
 shift_change:["version","shift","class","studentId","reqShift","name","guardianName","category","remarks","reference"],
 version_change:["version","shift","class","studentId","reqVersion","reqShift","name","guardianName","category","remarks","reference"],
 miscellaneous:["subject","class","requirement","remarks","category","reference"]};
var FM={version:{l:"Version",o:VERSIONS},shift:{l:"Shift",o:SHIFTS},"class":{l:"Class",o:CLASSES},studentId:{l:"Student ID"},reqShift:{l:"Requested Shift",o:SHIFTS},reqVersion:{l:"Requested Version",o:VERSIONS},subject:{l:"Subject"},requirement:{l:"Requirement",area:1},name:{l:"Applicant Name"},guardianName:{l:"Guardian Name"},category:{l:"Category",o:CATS},remarks:{l:"Remarks",area:1},reference:{l:"Reference"},group:{l:"Group",o:GROUPS}};
var ST=[["applied","Applied","#fff","#374151","#d1d5db"],["seen","Seen","#dbeafe","#1e40af","#93c5fd"],["short_listed","Short Listed","#dcfce7","#166534","#86efac"],["called_for_exam","Called For Exam","#ede9fe","#5b21b6","#c4b5fd"],["attended_exam","Attended Exam","#cffafe","#155e75","#67e8f9"],["absent_on_exam","Absent on Exam","#ffedd5","#9a3412","#fdba74"],["selected_for_reexam","Selected For Re-Exam","#fef9c3","#854d0e","#fde047"],["approved","Approved","#16a34a","#fff","#15803d"],["declined","Declined","#fee2e2","#991b1b","#fca5a5"]];
var STM={};ST.forEach(function(s){STM[s[0]]=s})
var PUBLIC=["applied","approved","declined"];
var ROLES={super_admin:"Super Admin",admin_principal:"Admin (Principal)",admin_office:"Admin (Office)",entry:"Entry",admin_officer:"Admin Officer"};
var DOCTYPES=["Result","Marksheet","Application","TC","BAF Job Testimonial","Student's Birth Certificate","Others"];
function canStatus(r){return r==="super_admin"||r==="admin_principal"||r==="admin_office"}
function canSeats(r){return canStatus(r)}

/* ---------- sample data ---------- */
var names=["Rafiq Ahmed","Nusrat Jahan","Tanvir Hasan","Sadia Islam","Imran Khan","Farhana Akter","Mahin Chowdhury","Tasnim Rahman","Arif Hossain","Samira Haque","Zayan Karim","Lamia Sultana","Rakib Hasan","Anika Tabassum","Nabil Sarker","Ishrat Zaman"];
var APPS=[],SEQ=0,SLN=0;
function addApp(o){SEQ++;o.id=SEQ;
 if(!o.appSl){var c;do{SLN++;c=SESSION+String(SLN).padStart(4,"0")}while(APPS.some(function(a){return a.appSl===c}));o.appSl=c}
 o.statusHistory=o.statusHistory||[{status:"applied",at:new Date(),by:"",note:"Application submitted"}];
 o.documents=o.documents||[];if(o.examMarks===undefined)o.examMarks=null;o.createdAt=o.createdAt||new Date();APPS.push(o);return o}
(function(){var tk=["admission","admission","shift_change","admission","version_change","admission","miscellaneous"];
 for(var i=0;i<28;i++){var t=tk[i%7],st=["applied","short_listed","approved","seen","applied","called_for_exam","approved","declined","short_listed","attended_exam","applied"][i%11];
  var o={type:t,name:names[i%16],guardianName:"Guardian of "+names[i%16].split(" ")[0],"class":CLASSES[(i*5+i%3)%13],version:VERSIONS[(i*3+(i>>2))%2],shift:SHIFTS[(i>>1)%2],category:CATS[i%6],reference:i%3?"":"Col. A. Rahman",remarks:i%4===1?"Recommended by principal":"",phone:"0171100"+String(1000+i),status:st,enteredBy:i%3===0?"Entry User":(i%3===1?"Office Staff":""),createdAt:new Date(Date.now()-i*86400000*2)};
  if(GROUP_CLASSES.indexOf(o["class"])>-1&&t==="admission")o.group=GROUPS[i%3];
  if(t==="shift_change"){o.studentId="S"+(2000+i);o.reqShift=o.shift==="Morning"?"Day":"Morning"}
  if(t==="version_change"){o.studentId="S"+(2000+i);o.reqVersion=o.version==="Bangla"?"English":"Bangla";o.reqShift="Day"}
  if(t==="miscellaneous"){o.subject="Certificate correction";o.requirement="Name spelling fix on testimonial";delete o.version;delete o.shift}
  if(["attended_exam","selected_for_reexam","approved"].indexOf(st)>-1)o.examMarks=50+((i*7)%48);
  if(st!=="applied")o.statusHistory=[{status:"applied",at:o.createdAt,by:"",note:"Application submitted"},{status:st,at:new Date(),by:"Office Staff",note:""}];
  addApp(o)}})();
var SEATS={};
CLASSES.forEach(function(c,i){VERSIONS.forEach(function(v,j){SHIFTS.forEach(function(s,k){SEATS[v+"|"+s+"|"+c]={status:(((i*3+j*5+k*2)%9)-4)*5,sec:2+((i+j+k)%4)}})})});

/* ---------- state ---------- */
var S={view:"apply",role:null,user:"",F:{type:"admission",status:"",version:"",shift:"",cls:"",q:"",marks:false,page:1},PAGE:8,Q:[],applyType:"admission",done:null,track:null,trackErr:""};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},2200)}
function seal(s){var c=STM[s]||STM.applied;return '<span class="seal" style="background:'+c[2]+';color:'+c[3]+';border-color:'+c[4]+'"><i></i>'+c[1]+'</span>'}
function fmtD(d){return new Date(d).toLocaleDateString()}
function fmtDT(d){return new Date(d).toLocaleString()}

/* ---------- shell ---------- */
function go(v){S.view=v;S.done=null;render()}
function render(){
 var admin=S.role&&["admin","entry2","seats"].indexOf(S.view)>-1;
 var nav;
 if(S.role&&(S.view==="admin"||S.view==="entry2"||S.view==="seats")){
  nav='<a class="'+(S.view==="admin"?"on":"")+'" onclick="go(\'admin\')">Applications</a><a class="'+(S.view==="entry2"?"on":"")+'" onclick="go(\'entry2\')">New Entry</a>'+(canSeats(S.role)?'<a class="'+(S.view==="seats"?"on":"")+'" onclick="go(\'seats\')">Seats</a>':'')+'<a onclick="go(\'apply\')">Public site</a><span class="muted" style="font-size:12px">'+ROLES[S.role]+'</span><a onclick="logout()">Sign out</a>';
 }else{
  nav='<a class="'+(S.view==="apply"?"on":"")+'" onclick="go(\'apply\')">Apply</a><a class="'+(S.view==="track"?"on":"")+'" onclick="go(\'track\')">Track Status</a><a class="'+(S.view==="login"?"on":"")+'" onclick="'+(S.role?"go('admin')":"go('login')")+'">'+(S.role?"Dashboard":"Staff Login")+'</a>';
 }
 var h='<header class="hdr"><div class="hdr-in"><div class="brand"><span class="crest">SD</span><div><div class="bn">BAF Shaheen College Dhaka</div><div class="bs">Application Management System</div></div></div><nav class="nav">'+nav+'</nav></div></header><main class="wrap'+((S.view==="admin"||S.view==="seats")?"":" narrow")+'">';
 if(S.view==="apply")h+=viewForm(false);
 else if(S.view==="entry2")h+=viewForm(true);
 else if(S.view==="track")h+=viewTrack();
 else if(S.view==="login")h+=viewLogin();
 else if(S.view==="admin")h+=viewAdmin();
 else if(S.view==="seats")h+=viewSeats();
 h+='</main>';$("app").innerHTML=h;
 if(S.view==="admin")renderList();
 window.scrollTo(0,0);
}
function logout(){S.role=null;S.user="";go("apply")}

/* ---------- apply form ---------- */
function fieldHTML(k){var m=FM[k],id="f_"+k,h='<div class="field'+(m.area?" full":"")+'"><label for="'+id+'">'+m.l+'</label>';
 if(m.area)h+='<textarea id="'+id+'"></textarea>';
 else if(m.o){h+='<select id="'+id+'"'+(k==="class"?' onchange="syncGroup()"':'')+'><option value="">Select '+m.l.toLowerCase()+'</option>'+m.o.map(function(o){return'<option>'+esc(o)+'</option>'}).join("")+'</select>'}
 else h+='<input id="'+id+'"'+(k==="name"?" required":"")+'>';
 return h+'</div>'}
function viewForm(staff){
 if(S.done){var d=S.done;return '<div class="card pad"><span class="eyebrow">Submitted</span><h2 style="font-size:21px;margin-bottom:10px">Application received</h2><p class="muted">Keep your Serial Number safe &mdash; it is also your tracking number.</p><div style="border:1px dashed var(--rule2);border-radius:8px;padding:14px;margin:14px 0"><div class="muted" style="font-size:11px;text-transform:uppercase">Serial No (also your tracking number)</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:600">'+d.appSl+'</div></div><button class="btn ba" onclick="go(\''+(staff?"entry2":"apply")+'\')">Submit another</button></div>'}
 var h='<span class="eyebrow">'+(staff?"New Entry":"New Application")+'</span><h1 class="title">Submit an application</h1><p class="sub">'+(staff?"Recorded under your account. You may set a Manual App Sl, or leave blank to auto-generate.":"Choose the type, fill in the details, and you will get a Serial Number (also your tracking number).")+'</p><div class="tabs">';
 Object.keys(TYPES).forEach(function(t){h+='<button class="tab'+(t===S.applyType?" on":"")+'" onclick="S.applyType=\''+t+'\';render()">'+TYPES[t]+'</button>'});
 h+='</div><form class="card pad" onsubmit="return submitApp(event,'+(staff?1:0)+')"><div id="ferr"></div><div class="grid2">';
 TFIELDS[S.applyType].forEach(function(k){if(k!=="group")h+=fieldHTML(k)});
 if(S.applyType==="admission")h+='<div id="groupWrap"></div>';
 h+='<div class="field"><label for="f_phone">Mobile Number</label><input id="f_phone" type="tel" placeholder="01XXXXXXXXX"></div>';
 if(staff)h+='<div class="field"><label for="f_appSl">Manual App Sl (optional)</label><input id="f_appSl" placeholder="Leave blank to auto-generate" style="font-family:ui-monospace,monospace"></div>';
 if(staff)h+='<div style="grid-column:1/-1;margin-top:6px;padding-top:16px;border-top:1px solid var(--rule)"><h3 style="font-size:15px;margin-bottom:4px">Documents (optional)</h3><p class="muted" style="font-size:12.5px;margin:0 0 10px">Any image or PDF, any size &mdash; shrunk to under 200 KB automatically (big PDFs become images).</p><div id="qlist">'+qHTML()+'</div><div class="grid2"><div class="field"><label>Document Type</label><select id="q_dt">'+DOCTYPES.map(function(t){return'<option>'+esc(t)+'</option>'}).join("")+'</select></div><div class="field"><label>Add File</label><input id="q_f" type="file" accept="application/pdf,image/*" onchange="queueFile(this)"></div></div><div id="qbusy" class="muted" style="font-size:12.5px;margin-top:6px"></div></div>';
 return h+'</div><div style="margin-top:18px"><button class="btn bp" type="submit" style="width:100%">Submit Application</button></div></form>'}
function syncGroup(){var w=$("groupWrap");if(!w)return;var c=$("f_class").value;
 w.innerHTML=GROUP_CLASSES.indexOf(c)>-1?fieldHTML("group"):""}
function submitApp(e,staff){e.preventDefault();var o={type:S.applyType,status:"applied"};
 TFIELDS[o.type].forEach(function(k){var el=$("f_"+k);if(el&&el.value.trim())o[k]=el.value.trim()});
 o.phone=$("f_phone").value.trim();
 if(o.type!=="miscellaneous"&&!o.name){$("ferr").innerHTML='<div class="alert err">Name is required</div>';return false}
 if(staff){o.enteredBy=S.user;var m=$("f_appSl").value.trim();
  if(m){if(APPS.some(function(a){return a.appSl.toLowerCase()===m.toLowerCase()})){$("ferr").innerHTML='<div class="alert err">App Sl "'+esc(m)+'" is already in use</div>';return false}o.appSl=m}}
 if(staff){o.documents=S.Q.map(function(q){return{type:q.type,name:q.name,size:q.size}});S.Q=[]}
 S.done=addApp(o);render();return false}

/* ---------- documents: any image/PDF -> under 200 KB ---------- */
var MAXB=200*1024,TARGET=190*1024;
function blobSz(c,q){return new Promise(function(r){c.toBlob(r,"image/jpeg",q)})}
function shrink(src,w,h){var sc=Math.min(1,1800/Math.max(w,h)),qs=[.85,.75,.65,.55,.45,.35,.28];
 function round(n){if(n>=8||Math.min(w,h)*sc<300)return Promise.reject(new Error("Could not shrink this file under 200 KB"));
  var W=Math.max(1,Math.round(w*sc)),H=Math.max(1,Math.round(h*sc)),c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(src,0,0,W,H);
  var i=0;function tryQ(){if(i>=qs.length){sc*=.8;return round(n+1)}return blobSz(c,qs[i++]).then(function(b){return b&&b.size<=TARGET?b:tryQ()})}
  return tryQ()}
 return round(0)}
